<h2>Add New Student</h2>

<form #studentForm="ngForm"
      (ngSubmit)="addStudent(name.value, course.value, +fees.value, status.value); studentForm.reset()">

  <div>
    <label>Student Name:</label>
    <input type="text" #name required>
  </div>

  <div>
    <label>Course:</label>
    <input type="text" #course required>
  </div>

  <div>
    <label>Fees:</label>
    <input type="number" #fees required>
  </div>

  <div>
    <label>Status:</label>
    <select #status>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  <button type="submit">Add Student</button>

</form>
